url: https://paulesantos.github.io/wcvpmatch/
authors:
  Paul Efren Santos Andrade:
    href: https://paulefrensa.rbind.io/
template:
  bootstrap: 5
  bslib:
    font_scale: 1.0
    base_font:
      google: "Jost"
    code_font:
      google: "Overpass Mono"
    heading_font:
      google: "Abhaya Libre"
    bg: "#f7f9f8"           # blanco con leve tinte vegetal (como POWO)
    fg: "#1a1a1a"           # negro tipográfico
    primary: "#1a6b6b"      # teal profundo — color institucional Kew
    secondary: "#a8cece"    # teal claro para elementos secundarios
    link-color: "#1a6b6b"   # mismo teal para coherencia
    info: "#cce4e4"         # teal muy suave para alertas info
    headings-color: "#0e4f4f"   # teal más oscuro para títulos
    navbar-bg: "#ffffff"        # navbar blanca como POWO
    navbar-light-color: "#0e4f4f"
    navbar-light-hover-color: "#1a6b6b"
home:
  title: wcvpmatch
  description: Taxonomic name reconciliation against the WCVP backbone.
  links:
    - text: Source code
      href: https://github.com/PaulESantos/wcvpmatch
    - text: Report an issue
      href: https://github.com/PaulESantos/wcvpmatch/issues
navbar:
  structure:
    left: [intro, reference, news]
    right: [search, github]
reference:
  - title: Core workflow
    desc: Main entry points for parsing names, checking setup, and running the full reconciliation pipeline.
    contents:
      - classify_spnames
      - wcvp_matching
      - wcvp_setup_info
  - title: Matching stages
    desc: Lower-level helpers that expose the staged matching strategy used internally by the main pipeline.
    contents:
      - wcvp_direct_match
      - wcvp_genus_match
      - wcvp_fuzzy_match_genus
      - wcvp_direct_match_species_within_genus
      - wcvp_fuzzy_match_species_within_genus
      - wcvp_suffix_match_species_within_genus
  - title: Backbone utilities
    desc: Utilities for prefiltering and indexing a WCVP-like target backbone.
    contents:
      - build_genus_index
      - prefilter_target_by_genus
  - title: Example data
    contents:
      - fia
news:
  one_page: true
